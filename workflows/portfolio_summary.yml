name: Marks Portfolio Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'STATUS'
        type: choice
        options:
          - STATUS
          - BUY
          - SELL
      ticker:
        description: 'Stock Ticker (Leave empty for STATUS)'
        required: false
        default: ''
      shares:
        description: 'Number of Shares (Leave empty for STATUS)'
        required: false
        default: ''
      price:
        description: 'Price per Share (Leave empty for STATUS)'
        required: false
        default: ''

jobs:
  manage-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: portfolio-manager
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib requests

      - name: Execute Portfolio Action
        env:
          DISCORD_PORTFOLIO_WEBHOOK: ${{ secrets.DISCORD_PORTFOLIO_WEBHOOK }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "STATUS" ]; then
            python portfolio/marks_portfolio_update.py STATUS
          else
            python portfolio/marks_portfolio_update.py ${{ github.event.inputs.action }} ${{ github.event.inputs.ticker }} ${{ github.event.inputs.shares }} ${{ github.event.inputs.price }}
          fi

      - name: Auto-commit Portfolio Changes
        if: github.event.inputs.action != 'STATUS'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add portfolio/marks_portfolio.json && git commit -m "Update portfolio: ${{ github.event.inputs.action }} ${{ github.event.inputs.ticker }}" && git push)
